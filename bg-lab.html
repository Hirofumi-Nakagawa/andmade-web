<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Background Lab — ANDMADE</title>
<!--
  背景演出の検証ツール（スタンドアロン / ビルド不要）
  ==================================================
  About / Contact の背景候補:「シェーダーで描いたような色面 + グレイン +
  さりげない動き」を、サイトに組み込む前に単体で検証するためのページ。
  このファイルをブラウザで直接開くだけで動く（サーバー不要・依存ライブラリなし）。

  仕組み:
  - WebGL のフラグメントシェーダー 1 枚だけで全画面を描画。
    fbm(フラクタルノイズ)のドメインワープで色面を作り、ストリーク(方向指定可)で
    モーションブラーしたような流れを出し、最後にフィルムグレインを乗せる。
    (「花オブジェクト」機能は削除 — 参考画像の方向性が「色面グラデの境界を
    調整して作る」に固まったため。)
  - グラデの境界は「境界の幅」でくっきり↔なだらかを調整でき、「にじみ」系の
    3スライダーでエッジを粒状に溶かせる — イースターエッグ背景ロゴの
    ディゾルブ(グレインでエッジが崩れ、ストリーク軸に沿って伸びる)と同じ手法。
  - 画像アセットは一切使わない(現行 Contact 背景の「画像を重ねて動かす」方式とは
    根本的に別物)。動きはノイズ空間をゆっくり滑らせているだけなので単調にならない。
  - 描画コスト: フルスクリーン 1 パス + ノイズ計算のみ。
    さらに「解像度スケール」で内部解像度を落とせる(軽い + タダでソフトになる)。

  サイトへの組み込み方(検証で方向性が固まったら):
  - 右下の「設定をコピー」で現在の全パラメータが JSON でクリップボードに入る。
  - この <script> 内の FRAG(フラグメントシェーダー)と、その JSON の値を
    そのまま React コンポーネント(<canvas> + useEffect)に移植すればよい。
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- コントロールパネル ---- */
  #panel {
    position: fixed; top: 16px; right: 16px; width: 252px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    background: rgba(20, 20, 20, 0.72); backdrop-filter: blur(12px);
    color: #eee; font: 11px/1.6 -apple-system, "Helvetica Neue", sans-serif;
    border-radius: 10px; padding: 14px 16px 12px;
    user-select: none; z-index: 10;
  }
  #panel h1 { font-size: 11px; font-weight: 600; letter-spacing: .08em; margin: 0 0 10px; }
  #panel h2 {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; color: #999;
    margin: 14px 0 2px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12);
  }
  #panel label { display: block; margin-top: 8px; color: #bbb; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel .row output { width: 34px; text-align: right; color: #888; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { flex: 1; accent-color: #ddd; height: 18px; }
  #panel select {
    width: 100%; margin-top: 2px; background: #2a2a2a; color: #eee;
    border: 1px solid #444; border-radius: 5px; font: inherit; padding: 3px 4px;
  }
  #swatches { display: flex; gap: 6px; margin-top: 6px; }
  input[type=color] {
    height: 24px; padding: 0; border: 1px solid #444; border-radius: 5px;
    background: none; cursor: pointer;
  }
  #swatches input[type=color] { flex: 1; }
  #panel .colorRow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #panel .colorRow input[type=color] { width: 44px; }
  #panel .colorRow span { color: #bbb; }
  #panel .btns { display: flex; gap: 6px; margin-top: 10px; }
  #panel button {
    flex: 1; background: #2a2a2a; color: #eee; border: 1px solid #444;
    border-radius: 5px; font: inherit; padding: 4px 0; cursor: pointer;
  }
  #panel button:hover { background: #3a3a3a; }
  #panel .note { color: #777; margin-top: 6px; }
  #stats { margin-top: 10px; color: #777; display: flex; justify-content: space-between; }
  #hint { position: fixed; left: 16px; bottom: 12px; color: rgba(255,255,255,.4);
          font: 10px/1 -apple-system, sans-serif; letter-spacing: .06em; z-index: 10; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="panel">
  <h1>BACKGROUND LAB</h1>

  <label>パレット
    <select id="palette"></select>
  </label>
  <div id="swatches">
    <input type="color" data-c="0" /><input type="color" data-c="1" /><input type="color" data-c="2" /><input type="color" data-c="3" /><input type="color" data-c="4" />
  </div>

  <label>速度 <span class="row"><input type="range" id="speed"    min="0"    max="0.30" step="0.005" /><output></output></span></label>
  <label>スケール（模様の大きさ）<span class="row"><input type="range" id="scale" min="0.5" max="6" step="0.1" /><output></output></span></label>
  <label>ワープ（ゆらぎの複雑さ）<span class="row"><input type="range" id="warp" min="0" max="4" step="0.1" /><output></output></span></label>
  <label>形の複雑さ（ディテール層数）<span class="row"><input type="range" id="octaves" min="1" max="4" step="1" /><output></output></span></label>
  <label>コントラスト <span class="row"><input type="range" id="contrast" min="0.5" max="2" step="0.05" /><output></output></span></label>
  <label>カーソル反応（触れた所が歪む）<span class="row"><input type="range" id="cursorStrength" min="0" max="2" step="0.05" /><output></output></span></label>

  <h2>ブラー（ストリーク）</h2>
  <label>強さ <span class="row"><input type="range" id="streak" min="0" max="6" step="0.1" /><output></output></span></label>
  <label>向き（度 / 90=縦）<span class="row"><input type="range" id="blurAngle" min="0" max="180" step="1" /><output></output></span></label>

  <h2>グラデの境界</h2>
  <label>境界の幅（小=くっきり）<span class="row"><input type="range" id="edgeSoft" min="0.05" max="2" step="0.05" /><output></output></span></label>
  <label>にじみ量（ディゾルブ）<span class="row"><input type="range" id="edgeNoise" min="0" max="0.6" step="0.01" /><output></output></span></label>
  <label>にじみの粒度（px）<span class="row"><input type="range" id="edgeNoiseScale" min="1" max="10" step="0.5" /><output></output></span></label>
  <label>にじみの伸び（ブラー向きに沿う）<span class="row"><input type="range" id="edgeStretch" min="0" max="12" step="0.5" /><output></output></span></label>
  <div class="colorRow"><input type="color" id="lineColor" /><span>境界線の色</span></div>
  <label>境界線の太さ（0で無し）<span class="row"><input type="range" id="lineWidth" min="0" max="0.2" step="0.005" /><output></output></span></label>
  <label>境界線の透過 <span class="row"><input type="range" id="lineAlpha" min="0" max="1" step="0.05" /><output></output></span></label>
  <label>境界線のカバー率（線が付く割合）<span class="row"><input type="range" id="lineCoverage" min="0" max="1" step="0.05" /><output></output></span></label>
  <label>境界線のボケ（0=くっきり）<span class="row"><input type="range" id="lineBlur" min="0" max="1" step="0.05" /><output></output></span></label>
  <div class="note">にじみ=エッグ背景ロゴと同じ「グレインでエッジが溶ける」手法。境界の幅を狭めてにじみを足すと参考画像の質感に寄る。境界線は色面の境目に沿って引かれ、にじみの影響も受ける</div>

  <h2>画面上部の色</h2>
  <div class="colorRow"><input type="color" id="topColor" /><span>上部の色</span></div>
  <!-- max=2: 1で画面全高、それ以上はグラデの遷移がさらに長く緩くなり
       画面下端でも色が残る(smoothstepの下端が画面外に出るだけなので安全) -->
  <label>範囲（0で無効）<span class="row"><input type="range" id="topRange" min="0" max="2" step="0.05" /><output></output></span></label>
  <label>強さ <span class="row"><input type="range" id="topMix" min="0" max="1" step="0.05" /><output></output></span></label>

  <h2>グレイン</h2>
  <label>量 <span class="row"><input type="range" id="grain" min="0" max="0.35" step="0.005" /><output></output></span></label>
  <label>粒度 <span class="row"><input type="range" id="grainSize" min="1" max="6" step="0.5" /><output></output></span></label>
  <label>速度（更新fps / 0で静止）<span class="row"><input type="range" id="grainFps" min="0" max="60" step="1" /><output></output></span></label>

  <h2>描画</h2>
  <label>解像度スケール（軽さ/ソフトさ）<span class="row"><input type="range" id="renderScale" min="0.15" max="1" step="0.05" /><output></output></span></label>

  <div class="btns">
    <button id="pause">一時停止</button>
    <button id="reseed">シード変更</button>
  </div>
  <div class="btns">
    <button id="copy">設定をコピー</button>
    <button id="toggleUi">UIを隠す (H)</button>
  </div>
  <div id="stats"><span id="fps">-- fps</span><span id="res">--</span></div>
</div>
<div id="hint">H: UI表示切替 / Space: 一時停止</div>

<script>
"use strict";

/* ================= フラグメントシェーダー =================
   サイトに組み込むときはこの文字列をそのまま移植する。 */
const FRAG = `
precision highp float;

uniform vec2  u_res;        // 実描画解像度(px)
uniform float u_time;       // 経過秒
uniform float u_seed;       // ノイズ空間のオフセット(シード)
uniform float u_speed;      // 時間の進み
uniform float u_scale;      // ノイズ空間の拡大率(小さいほど大きな模様)
uniform float u_warp;       // ドメインワープ強度
uniform float u_streak;     // ストリーク(伸ばし)強度
uniform float u_angle;      // ストリークの向き(度, 90=縦)
uniform float u_contrast;   // 色のコントラスト
uniform vec2  u_mouse;          // カーソル位置(uv, 左下原点, JS側でスムージング済み)
uniform float u_cursorStrength; // カーソル周辺の局所歪みの強さ(0で無反応)
uniform int   u_octaves;        // fbmのディテール層数(少ないほどシンプルな形)
uniform float u_grain;      // グレイン量
uniform float u_grainSize;  // グレイン1粒のpxサイズ
uniform float u_grainFps;   // グレインの更新頻度(0で静止)
uniform vec3  u_c0, u_c1, u_c2, u_c3, u_c4; // パレット5色
uniform vec3  u_topCol;     // 画面上部の色
uniform float u_topRange;   // 上部グラデの範囲(0で無効)
uniform float u_topMix;     // 上部グラデの強さ

// グラデの境界 — 参考画像(Colour Blend Textures)寄せの調整項目。
uniform float u_edgeSoft;       // 境界の幅の倍率(1=従来のなだらかさ, 小さいほどくっきり)
uniform float u_edgeNoise;      // 境界のにじみ量(場の値をグレインで揺らす)
uniform float u_edgeNoiseScale; // にじみグレイン1粒のpxサイズ
uniform float u_edgeStretch;    // にじみグレインのストリーク軸方向の伸び
uniform vec3  u_lineColor;      // 境界線の色
uniform float u_lineWidth;      // 境界線の太さ(場の値単位, 0で無効)
uniform float u_lineAlpha;      // 境界線の不透明度(0..1)
uniform float u_lineCoverage;   // 境界のうち線が付く割合(1で全周, 0.4で4割くらい)
uniform float u_lineBlur;       // 線のボケ(0=輪郭くっきりの帯, 1=中心から端まで全ボケ)

// ---- value noise + fbm（定番の軽量実装）----
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i),                 hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
             u.y);
}
// u_octaves で層数可変(GLSL ES 1.00 はループ上限が定数必須なので break 方式)。
// 層を減らすと細かい起伏が消え、大きくなだらかな形だけが残る —
// 「形状をシンプルにして」向けの主レバー。層数に依らず値域の中心が
// ずれないよう、実際に足した振幅の合計 (1 - 0.5^n) で正規化する。
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    if (i >= u_octaves) break;
    v += a * noise(p);
    p = p * 2.03 + vec2(17.0, 9.0);
    a *= 0.5;
  }
  return v / (1.0 - pow(0.5, float(u_octaves)));
}

mat2 rot(float a) {
  float c = cos(a);
  float s = sin(a);
  return mat2(c, -s, s, c);
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  float aspect = u_res.x / u_res.y;

  // ストリークの向き: 90度=縦(従来のデフォルト)を基準に回転。
  float ang = radians(u_angle - 90.0);
  mat2 R = rot(ang);

  // ---- ノイズ色面 ----
  vec2 p = uv;
  p.x *= aspect;
  // カーソル反応: 全体を平行移動させるのではなく、カーソルが触れた場所の
  // 揺らぎだけを局所的に歪ませる — per direct follow-up ("カーソルが揺らぎに
  // 触れたら、揺らぎが少し歪むとか、そういう感じ")。カーソルからの距離の
  // ガウス減衰内だけ、サンプル位置を放射方向に押し出す(レンズで押した
  // ような膨らみ)。dvec は中心でゼロになるので正規化不要 = NaN も出ない。
  // 位置はJS側でスムージング済みなので、歪みもゆったり追従する。
  vec2 mp = u_mouse - 0.5;
  mp.x *= aspect;
  vec2 dvec = (uv - 0.5) * vec2(aspect, 1.0) - mp;
  float infl = exp(-dot(dvec, dvec) / (2.0 * 0.15 * 0.15));
  p += dvec * infl * u_cursorStrength;
  p = R * p;                              // ストリーク軸を回転
  p.y /= 1.0 + u_streak;                  // 軸に沿って引き伸ばす→流れたブラー感
  p = p * u_scale + u_seed;               // スケール + シードオフセット

  float t = u_time * u_speed;

  // ドメインワープ2段: q で一度ゆがめた座標を r で再度ゆがめる。
  // t の係数を層ごとに変える(逆方向も混ぜる)ことで、単純な平行移動に
  // 見えない「その場でゆっくり融け続ける」動きになる。
  vec2 q = vec2(fbm(p + vec2(0.0, 0.0) + t * 0.10),
                fbm(p + vec2(5.2, 1.3) - t * 0.07));
  vec2 r = vec2(fbm(p + u_warp * q + vec2(1.7, 9.2) + t * 0.15),
                fbm(p + u_warp * q + vec2(8.3, 2.8) - t * 0.12));
  float f = fbm(p + u_warp * r);

  // ---- 境界のにじみ(ディゾルブ) ----
  // エッグ背景ロゴのブラーと同じ考え方: ガウスぼかしではなく、粒(グレイン)
  // でエッジそのものを崩す。ストリーク軸に沿って引き伸ばした座標で
  // グレインをサンプルし、その値を smoothstep に入る「場」に足すことで、
  // 色面の境界だけが粒状に溶けて伸びる(色面の内部はほぼ変化しない —
  // smoothstep の遷移帯の中でしか値の揺れが効かないため)。
  // グレインの更新はフィルムグレインと同じ u_grainFps に同期。
  float dn = 0.0;
  if (u_edgeNoise > 0.0) {
    float eFrame = u_grainFps > 0.0 ? floor(u_time * u_grainFps) : 0.0;
    vec2 gp = R * gl_FragCoord.xy;
    gp.y /= 1.0 + u_edgeStretch;
    gp = floor(gp / max(u_edgeNoiseScale, 1.0));
    float en = mix(hash(gp + fract(eFrame * 0.1031) * vec2(19.3, 7.7)),
                   hash(gp * 0.37 + 13.7), 0.5);
    dn = (en - 0.5) * u_edgeNoise;
  }

  // 5色を f / q / r の別々の場で重ねる(1つの値だけで塗り分けると
  // 等高線っぽい縞が出るため、互いに独立な場で混ぜる)。
  // 各 smoothstep は従来の (下端, 上端) を中心±半幅に書き換えたもの —
  // u_edgeSoft=1 で従来と完全に同じ遷移帯、小さくすると境界がくっきり。
  // dn(にじみ)は場の値側に足す。
  vec3 col = mix(u_c0, u_c1, smoothstep(0.40 - 0.25 * u_edgeSoft, 0.40 + 0.25 * u_edgeSoft, f + dn));
  col = mix(col, u_c2, smoothstep(0.60 - 0.25 * u_edgeSoft, 0.60 + 0.25 * u_edgeSoft, q.x + dn) * 0.85);
  col = mix(col, u_c3, smoothstep(0.70 - 0.25 * u_edgeSoft, 0.70 + 0.25 * u_edgeSoft, r.y + dn) * 0.75);
  col = mix(col, u_c4, smoothstep(0.775 - 0.225 * u_edgeSoft, 0.775 + 0.225 * u_edgeSoft, q.y * f * 1.6 + dn) * 0.6);

  col = (col - 0.5) * u_contrast + 0.5;

  // ---- 境界線 ----
  // 各色レイヤーの smoothstep 中心(=色面の境目)からの距離が u_lineWidth 内
  // のところに u_lineColor を引く。場の値にはにじみ dn を足したものを使う
  // ので、線もにじみ設定に沿って粒状に崩れる。4レイヤー分の線マスクは max
  // で合成(重なった所が濃くならないように)。コントラスト適用後に乗せるので
  // 線の色はピッカーの色そのまま出る。
  //
  // ボケ: 線の断面プロファイルを smoothstep(core, width, dist) で制御 —
  // core=0(ボケ1)は中心から端まで全部グラデ(従来の見た目)、core≈width
  // (ボケ0)は幅いっぱいベタ塗り + 輪郭くっきりの帯。max(,0.02)は
  // core==width の縮退(smoothstepのゼロ割れ)回避。
  if (u_lineWidth > 0.0) {
    float core = u_lineWidth * (1.0 - max(u_lineBlur, 0.02));
    float e1 = 1.0 - smoothstep(core, u_lineWidth, abs(f + dn - 0.40));
    float e2 = 1.0 - smoothstep(core, u_lineWidth, abs(q.x + dn - 0.60));
    float e3 = 1.0 - smoothstep(core, u_lineWidth, abs(r.y + dn - 0.70));
    float e4 = 1.0 - smoothstep(core, u_lineWidth, abs(q.y * f * 1.6 + dn - 0.775));
    float lineM = max(max(e1, e2), max(e3, e4));
    // カバー率: 低周波ノイズ(色場とは独立したオフセット)でマスクし、境界の
    // ところどころにだけ線を残す — 値を下げるほど線が途切れ途切れになる。
    // 境目自体がワープで動くので、どの区間に線が付くかも時間とともに
    // ゆっくり移り変わる。±0.08のsmoothstepで途切れ端も少しなじませる。
    float covN = noise(p * 1.5 + vec2(31.7, 7.9));
    lineM *= 1.0 - smoothstep(u_lineCoverage - 0.08, u_lineCoverage + 0.08, covN);
    col = mix(col, u_lineColor, lineM * u_lineAlpha);
  }

  // ---- 画面上部の色 ----
  // uv.y=1(上端)に向かって u_topCol へ溶かす。範囲0で完全無効。
  if (u_topRange > 0.0) {
    float topM = smoothstep(1.0 - u_topRange, 1.0, uv.y);
    col = mix(col, u_topCol, topM * u_topMix);
  }

  // ---- フィルムグレイン ----
  // 表示ピクセル単位のホワイトノイズを u_grainFps で更新
  // (毎フレーム更新よりチラつきが落ち着き、フィルムっぽくなる。0で静止)
  float frame = u_grainFps > 0.0 ? floor(u_time * u_grainFps) : 0.0;
  vec2 gp = floor(gl_FragCoord.xy / u_grainSize);
  float g = hash(gp + fract(frame * 0.1031) * vec2(37.7, 17.3)) - 0.5;
  col += g * u_grain;

  gl_FragColor = vec4(col, 1.0);
}
`;

const VERT = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

/* ================= パレットプリセット =================
   添付リファレンス4枚 + サイト既存トーンから起こした5色組。 */
const PALETTES = {
  "sky（blue×purple）":        ["#87b1db", "#3782c5", "#dfa7da", "#85a7dd", "#d6e3f6"],
  "Silk（ピンク×オレンジ）":   ["#eae3d8", "#dd6da2", "#e2892f", "#b3a0cf", "#57384c"],
  "Meadow（花畑）":            ["#f0e6de", "#5c7a55", "#df8fb4", "#e0b44e", "#9b8cc4"],
  "Heat（黄×赤×深緑）":        ["#a9b39a", "#e3c33f", "#d43e1f", "#26402b", "#e5e0d2"],
  "Dusk（夜×橙×青）":          ["#232920", "#d98e2b", "#8fa3c9", "#47523c", "#ded6c6"],
  "Cream（サイト基調・淡）":   ["#f6f6f4", "#e4ddd2", "#cdbfae", "#b0b7a8", "#8f8779"],
  "Contact（黒ベース）":       ["#000000", "#141b1f", "#002324", "#00143d", "#0b1028"],
};

/* パレット固有の推奨パラメータ一式 — パレット選択時に色と一緒に全スライダー
   へ反映される(定義がないパレットは従来通り色だけ変わる)。どちらも実際に
   サイトへ組み込み済みの現行値そのまま:
     sky              → components/about-blend-background.tsx の SETTINGS
     Contact（黒ベース）→ components/contact-blend-background.tsx の SETTINGS
   どちらかを触ったらもう片方も合わせること。 */
const PRESET_PARAMS = {
  "sky（blue×purple）": {
    speed: 0.15, scale: 3.5, warp: 1.2, octaves: 2, streak: 3.5, blurAngle: 90,
    contrast: 1.15, cursorStrength: 0.1,
    grain: 0.07, grainSize: 1, grainFps: 12, renderScale: 0.7,
    topColor: "#ebfdff", topRange: 0.9, topMix: 1,
    edgeSoft: 0.1, edgeNoise: 0.01, edgeNoiseScale: 1, edgeStretch: 2,
    lineColor: "#ebfdff", lineWidth: 0.03, lineAlpha: 0.5, lineCoverage: 0.3, lineBlur: 1,
  },
  "Contact（黒ベース）": {
    speed: 0.15, scale: 3.2, warp: 1.2, octaves: 4, streak: 6, blurAngle: 180,
    contrast: 1.1, cursorStrength: 0.1,
    grain: 0.07, grainSize: 1, grainFps: 12, renderScale: 0.7,
    topColor: "#ebfdff", topRange: 0, topMix: 1,
    edgeSoft: 0.45, edgeNoise: 0.01, edgeNoiseScale: 1, edgeStretch: 2,
    lineColor: "#27272a", lineWidth: 0.03, lineAlpha: 0.5, lineCoverage: 0.5, lineBlur: 1,
  },
};

/* ================= WebGL セットアップ ================= */
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// フルスクリーン三角形(クアッドより1頂点少なく、定番の省コスト手法)
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "a_pos");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const name of ["u_res","u_time","u_seed","u_speed","u_scale","u_warp","u_streak","u_angle",
                    "u_contrast","u_mouse","u_cursorStrength","u_octaves",
                    "u_grain","u_grainSize","u_grainFps",
                    "u_c0","u_c1","u_c2","u_c3","u_c4",
                    "u_topCol","u_topRange","u_topMix",
                    "u_edgeSoft","u_edgeNoise","u_edgeNoiseScale","u_edgeStretch",
                    "u_lineColor","u_lineWidth","u_lineAlpha","u_lineCoverage","u_lineBlur"]) {
  U[name] = gl.getUniformLocation(prog, name);
}

/* ================= パラメータと UI ================= */
// 起動時のデフォルトは About ページに組み込み済みの現行値そのまま
// (= PRESET_PARAMS["sky（blue×purple）"] + sky パレットの5色)。
// Contact の現行値はパレットを「Contact（黒ベース）」に切り替えると入る。
// seed だけは実機側がマウント毎ランダムなのでラボ用の固定値。
const params = {
  palette: "sky（blue×purple）",
  colors: PALETTES["sky（blue×purple）"].slice(),
  ...PRESET_PARAMS["sky（blue×purple）"],
  seed: 99.59266902583109,
};

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

const paletteSel = document.getElementById("palette");
for (const name of Object.keys(PALETTES)) {
  const opt = document.createElement("option");
  opt.value = opt.textContent = name;
  paletteSel.appendChild(opt);
}
const swatches = [...document.querySelectorAll("#swatches input")];

function syncSwatches() {
  swatches.forEach((el, i) => { el.value = params.colors[i]; });
}
paletteSel.addEventListener("change", () => {
  params.palette = paletteSel.value;
  params.colors = PALETTES[paletteSel.value].slice();
  syncSwatches();
  // パレット固有の推奨パラメータがあれば、色以外も一括で反映(スライダー/
  // ピッカーのUI表示も同期)。renderScaleが変わりうるのでresize()も呼ぶ。
  const preset = PRESET_PARAMS[paletteSel.value];
  if (preset) {
    Object.assign(params, preset);
    syncControls();
    resize();
  }
});
swatches.forEach((el) => {
  el.addEventListener("input", () => { params.colors[+el.dataset.c] = el.value; });
});

// スライダー一括バインド
const sliders = ["speed","scale","warp","octaves","streak","blurAngle","contrast","cursorStrength",
                 "grain","grainSize","grainFps","renderScale",
                 "topRange","topMix","edgeSoft","edgeNoise","edgeNoiseScale","edgeStretch","lineWidth","lineAlpha","lineCoverage","lineBlur"];
for (const key of sliders) {
  const el = document.getElementById(key);
  el.value = params[key];
  const out = el.parentElement.querySelector("output");
  out.textContent = params[key];
  el.addEventListener("input", () => {
    params[key] = parseFloat(el.value);
    out.textContent = el.value;
    if (key === "renderScale") resize();
  });
}

// 単色ピッカー(上部の色 / 境界線の色)
for (const key of ["topColor", "lineColor"]) {
  const el = document.getElementById(key);
  el.value = params[key];
  el.addEventListener("input", () => { params[key] = el.value; });
}

// params → UI の一括同期(プリセット適用時用) — 各スライダーの値と数値表示、
// 単色ピッカーを現在のparamsに合わせ直す。
function syncControls() {
  for (const key of sliders) {
    const el = document.getElementById(key);
    el.value = params[key];
    el.parentElement.querySelector("output").textContent = params[key];
  }
  for (const key of ["topColor", "lineColor"]) {
    document.getElementById(key).value = params[key];
  }
}

// カーソル追従(uv, 左下原点)。フレーム毎に指数スムージングして u_mouse へ —
// サイト既存のContact/About背景と同じく、急に飛ばずゆったり付いてくる。
const mouseTarget = [0.5, 0.5];
const mouseSmoothed = [0.5, 0.5];
window.addEventListener("pointermove", (e) => {
  mouseTarget[0] = e.clientX / innerWidth;
  mouseTarget[1] = 1 - e.clientY / innerHeight;
});

let paused = false;
document.getElementById("pause").addEventListener("click", togglePause);
function togglePause() {
  paused = !paused;
  document.getElementById("pause").textContent = paused ? "再開" : "一時停止";
}
document.getElementById("reseed").addEventListener("click", () => {
  params.seed = Math.random() * 100;
});
document.getElementById("copy").addEventListener("click", async () => {
  const btn = document.getElementById("copy");
  await navigator.clipboard.writeText(JSON.stringify(params, null, 2));
  btn.textContent = "コピーしました";
  setTimeout(() => { btn.textContent = "設定をコピー"; }, 1200);
});
const panel = document.getElementById("panel");
const hint = document.getElementById("hint");
function toggleUi() { panel.classList.toggle("hidden"); hint.classList.toggle("hidden"); }
document.getElementById("toggleUi").addEventListener("click", toggleUi);
window.addEventListener("keydown", (e) => {
  if (e.key === "h" || e.key === "H") toggleUi();
  if (e.key === " ") { e.preventDefault(); togglePause(); }
});

/* ================= リサイズ / 描画ループ ================= */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(innerWidth  * dpr * params.renderScale));
  const h = Math.max(1, Math.round(innerHeight * dpr * params.renderScale));
  canvas.width = w;
  canvas.height = h;
  gl.viewport(0, 0, w, h);
  document.getElementById("res").textContent = w + "×" + h;
}
window.addEventListener("resize", resize);
resize();
syncSwatches();

// FPS 計測(指数移動平均でならす)
let fpsEma = 60;
let lastT = performance.now();
let shownTime = 0; // 一時停止中は進めない「見た目の経過時間」

function frame(now) {
  const dt = (now - lastT) / 1000;
  lastT = now;
  if (!paused) shownTime += dt;
  if (dt > 0) fpsEma = fpsEma * 0.95 + (1 / dt) * 0.05;
  document.getElementById("fps").textContent = fpsEma.toFixed(0) + " fps";

  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_time, shownTime);
  gl.uniform1f(U.u_seed, params.seed);
  gl.uniform1f(U.u_speed, params.speed);
  gl.uniform1f(U.u_scale, params.scale);
  gl.uniform1f(U.u_warp, params.warp);
  gl.uniform1f(U.u_streak, params.streak);
  gl.uniform1f(U.u_angle, params.blurAngle);
  gl.uniform1f(U.u_contrast, params.contrast);
  mouseSmoothed[0] += (mouseTarget[0] - mouseSmoothed[0]) * 0.04;
  mouseSmoothed[1] += (mouseTarget[1] - mouseSmoothed[1]) * 0.04;
  gl.uniform2f(U.u_mouse, mouseSmoothed[0], mouseSmoothed[1]);
  gl.uniform1f(U.u_cursorStrength, params.cursorStrength);
  gl.uniform1i(U.u_octaves, Math.round(params.octaves));
  gl.uniform1f(U.u_grain, params.grain);
  gl.uniform1f(U.u_grainSize, Math.max(1, params.grainSize * params.renderScale));
  gl.uniform1f(U.u_grainFps, params.grainFps);
  gl.uniform3fv(U.u_c0, hexToRgb(params.colors[0]));
  gl.uniform3fv(U.u_c1, hexToRgb(params.colors[1]));
  gl.uniform3fv(U.u_c2, hexToRgb(params.colors[2]));
  gl.uniform3fv(U.u_c3, hexToRgb(params.colors[3]));
  gl.uniform3fv(U.u_c4, hexToRgb(params.colors[4]));
  gl.uniform3fv(U.u_topCol, hexToRgb(params.topColor));
  gl.uniform1f(U.u_topRange, params.topRange);
  gl.uniform1f(U.u_topMix, params.topMix);
  gl.uniform1f(U.u_edgeSoft, params.edgeSoft);
  gl.uniform1f(U.u_edgeNoise, params.edgeNoise);
  // フィルムグレイン同様、内部解像度(renderScale)に合わせて粒サイズを補正 —
  // 解像度を落としても「にじみ」の見た目の粒度が画面上で変わらないように。
  gl.uniform1f(U.u_edgeNoiseScale, Math.max(1, params.edgeNoiseScale * params.renderScale));
  gl.uniform1f(U.u_edgeStretch, params.edgeStretch);
  gl.uniform3fv(U.u_lineColor, hexToRgb(params.lineColor));
  gl.uniform1f(U.u_lineWidth, params.lineWidth);
  gl.uniform1f(U.u_lineAlpha, params.lineAlpha);
  gl.uniform1f(U.u_lineCoverage, params.lineCoverage);
  gl.uniform1f(U.u_lineBlur, params.lineBlur);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
