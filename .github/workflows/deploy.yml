# さくらのレンタルサーバーへの自動デプロイ
# ============================================================================
# main に push すると、GitHub 上でビルドして out/ を rsync(SSH) で転送する。
# GitHub の Actions タブから手動実行もできる（CMS を更新したので中身だけ作り
# 直したい、というときはこちら。コードは変わっていなくても最新の microCMS の
# 内容で再ビルドされる）。
#
# 必要な設定は DEPLOY.md の「GitHub Actions の設定」を参照。
# Secrets を1つでも入れ忘れると SSH のログインで失敗する。

name: Deploy to Sakura

on:
  push:
    branches: [main]
  # Actions タブに「Run workflow」ボタンを出す。CMS 更新後の再ビルド用。
  workflow_dispatch:

# 同時に2本走ると転送が混ざって壊れるので、後から来た方を待たせる
# （cancel-in-progress: false = 走行中のものは中断せず完走させる。中断すると
#  中途半端にファイルが上がった状態でサーバーが残るため）。
concurrency:
  group: deploy-sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # package-lock.json を見て node_modules をキャッシュする。
          cache: npm

      # npm ci は package-lock.json どおりに厳密にインストールする
      # （npm install と違ってロックファイルを書き換えない）。
      - run: npm ci

      - name: Build
        # microCMS の内容はこの時点で取得され、HTML に焼き込まれる
        # （next.config.ts の output: "export" — DEPLOY.md 参照）。
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # サブディレクトリ公開のときだけ設定する（例: /preview）。
          # Secrets ではなく Variables（Settings → Secrets and variables →
          # Actions → Variables タブ）で管理する。秘密ではないうえ、本番公開時に
          # 空にするだけで切り替えられるため。
          # 未設定なら空文字 → next.config.ts 側で undefined 扱い＝ルート公開。
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      # scripts/verify-build.mjs は「検証」だけでなく、out/.htaccess の
      # __BASE_PATH__ を実際の公開先に「置換」もする（ErrorDocument は絶対パス
      # しか受け付けないため）。以前ここは test -f を並べた自前のチェックで、
      # このスクリプトを呼んでいなかった。そのため __BASE_PATH__ が文字列の
      # まま転送され、存在しないURLを開くと "__BASE_PATH__/404.html" という
      # 文字がそのまま表示されていた（Apache はスラッシュで始まらない
      # ErrorDocument の値を「表示する文字列」と解釈する）。
      # 引数は Build と同じ vars.BASE_PATH を渡すこと — 片方だけ変えると
      # アセットのパスと ErrorDocument が食い違う。
      - name: Verify build output
        run: node scripts/verify-build.mjs "${{ vars.BASE_PATH }}"

      # 転送は FTPS ではなく SSH(rsync)。
      # FTPS を諦めた経緯（同じ所で詰まったとき用のメモ）:
      #  1. さくらの「国外IPアドレスフィルタ」が FTP を海外IPから遮断していて、
      #     米国にある GitHub Actions のランナーからは接続すらできなかった
      #     （TLSハンドシェイク直後に切断 / "Server sent FIN packet unexpectedly"）。
      #  2. フィルタを解除するとログインは通るようになったが、今度は
      #     "Client is closed because read ECONNRESET (data socket)" で落ちた。
      #     さくらの ProFTPD はデータ接続にも制御接続と同じTLSセッションの
      #     再利用を要求するが、このアクションが使う Node の FTP ライブラリが
      #     それに対応しておらず、サーバー側にデータ接続を切られる。
      # SSH はそもそも国外IPフィルタの対象外で、データ接続という概念も無いため
      # どちらの問題も起きない。パスワードではなく鍵認証になる点でも安全。
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          # 環境変数経由で書き出す（YAML に直接展開すると鍵の改行が壊れる）
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ホスト鍵を先に取得しておく（対話プロンプトで止まらないように）
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          # 安全弁: --delete は転送先にあって out/ に無いファイルを消すので、
          # 転送先の指定を間違えるとホームディレクトリごと消しかねない。
          # 公開領域(www)配下であることを必ず確認してから実行する。
          case "$TARGET_DIR" in
            */www/*|*/www/) ;;
            *) echo "SSH_TARGET_DIR が www 配下ではありません: $TARGET_DIR"; exit 1 ;;
          esac

          # -r 再帰 / -l シンボリックリンク維持 / -t 時刻維持(差分判定に必要)
          # -z 圧縮 / --delete-after 転送成功後に不要ファイルを削除
          rsync -rltz --delete-after \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./out/ "$SSH_USER@$SSH_HOST:$TARGET_DIR"
